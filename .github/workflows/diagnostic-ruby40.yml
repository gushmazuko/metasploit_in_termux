# DIAGNOSTIC WORKFLOW — temporary, do not merge to master.
#
# Purpose: establish ground truth for whether the CURRENT, UNMODIFIED
# metasploit.sh works on the CURRENT termux/termux-docker:aarch64 image.
# As of 2026-11-15 Termux ships ruby 4.0.9; the last green CI run for this
# repo (2025-09-13) predates both LLVM 21 and Ruby 4.0, so no verified
# install exists on Ruby 4.0 at all.
#
# Verdict reading:
#   - job green  -> current installer works on Ruby 4.0.9
#   - job red    -> installer broken; see uploaded artifacts:
#       diagnostic-env.txt        ruby/clang/gem versions before install
#       diagnostic-apt.log        apt update/upgrade output
#       diagnostic-install.log    full installer output
#       diagnostic-post-env.txt   versions after install + symlink state
#       diagnostic-gemlogs/       gem_make.out / mkmf.log from failed
#                                 native gem builds (the real compiler errors)

name: Diagnostic — current installer on current Termux

on:
  workflow_dispatch:
  push:
    branches: [ "diagnostic/**" ]

jobs:
  diagnostic-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install DNS tools on host
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y dnsutils

      - name: Generate static DNS hosts for Termux container
        run: |
          set -euxo pipefail
          HOSTS="termux-hosts"
          : > "$HOSTS"
          domains=(
            packages.termux.dev
            packages-cf.termux.dev
            termux.dev
            raw.githubusercontent.com
            github.com
            rubygems.org
            index.rubygems.org
          )
          for d in "${domains[@]}"; do
            ip4=$(dig +short A "$d" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            if [[ -n "$ip4" ]]; then
              echo "$ip4 $d" >> "$HOSTS"
            else
              echo "WARN: no IPv4 for $d"
            fi
          done
          cat "$HOSTS"

      - name: Start Termux container
        run: |
          set -euxo pipefail
          docker pull termux/termux-docker:aarch64
          docker rm -f termux || true
          docker run -d -t --name termux \
            --security-opt seccomp=unconfined \
            -v "$PWD/termux-hosts:/system/etc/hosts:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            termux/termux-docker:aarch64
          sleep 5
          docker ps

      - name: Record environment before install
        run: |
          set -euxo pipefail
          docker exec -u system termux bash -lc '
            echo "== uname ==";        uname -a
            echo "== apt policy ruby =="; apt policy ruby || true
            echo "== ruby ==";         ruby -v || true
            echo "== gem ==";          gem -v || true
            echo "== bundle ==";       bundle -v || true
            echo "== clang ==";        clang --version | head -3 || true
          ' | tee diagnostic-env.txt

      - name: Seed apt sources and update
        run: |
          set -euxo pipefail
          docker exec -u system termux bash -lc '
            set -x
            echo "deb https://packages.termux.dev/apt/termux-main stable main" > /data/data/com.termux/files/usr/etc/apt/sources.list
            apt update -y
            DEBIAN_FRONTEND=noninteractive apt install -y curl git libssh2 -o Dpkg::Options::="--force-confnew"
          ' |& tee diagnostic-apt.log

      - name: Run current metasploit.sh (unmodified)
        run: |
          set -euxo pipefail
          docker exec -u system termux bash -lc '
            set -x
            cp /workspace/metasploit.sh "$HOME/metasploit.sh"
            chmod +x "$HOME/metasploit.sh"
            "$HOME/metasploit.sh" 2>&1 | tee "$HOME/metasploit_install.log"
            rc="${PIPESTATUS[0]}"
            echo "installer finished with exit code $rc"
            exit "$rc"
          ' |& tee diagnostic-install.log

      - name: Record environment after install
        if: always()
        run: |
          docker exec -u system termux bash -lc '
            echo "== ruby ==";    ruby -v || true
            echo "== gem ==";     gem -v || true
            echo "== bundle ==";  bundle -v || true
            echo "== clang ==";   clang --version | head -1 || true
            echo "== msf symlinks =="; ls -la /data/data/com.termux/files/usr/bin/msf* 2>/dev/null || echo "NO MSF SYMLINKS"
          ' |& tee diagnostic-post-env.txt || true

      # Smoke tests intentionally NOT if:always() — they decide the verdict.
      - name: Smoke test msfconsole
        run: |
          set -euxo pipefail
          docker exec -u system termux bash -lc 'msfconsole -qx "version; exit"' | tee msfconsole-version.txt

      - name: Smoke test msfvenom
        run: |
          set -euxo pipefail
          docker exec -u system termux bash -lc '
            set -eux
            cd /data/data/com.termux/files/usr/tmp
            msfvenom -p windows/meterpreter/reverse_tcp lhost=192.168.0.1 lport=4444 -f exe -o my_payload.exe
            ls -la my_payload.exe
            file my_payload.exe || true
          '

      - name: Collect native gem build logs from container
        if: always()
        run: |
          set -x
          mkdir -p diagnostic-gemlogs
          docker exec -u system termux bash -lc \
            'find /data/data/com.termux/files/usr/lib/ruby/gems -name gem_make.out -o -name mkmf.log 2>/dev/null | head -50' \
            > gemlog-list.txt || true
          cat gemlog-list.txt || true
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            dest="diagnostic-gemlogs/$(echo "$f" | tr '/' '_')"
            docker cp "termux:$f" "$dest" || true
          done < gemlog-list.txt
          ls -la diagnostic-gemlogs || true

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-ruby40
          path: |
            termux-hosts
            diagnostic-env.txt
            diagnostic-apt.log
            diagnostic-install.log
            diagnostic-post-env.txt
            msfconsole-version.txt
            diagnostic-gemlogs/

      - name: Cleanup
        if: always()
        run: docker rm -f termux || true
